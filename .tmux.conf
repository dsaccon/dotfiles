# remap prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-option -g history-limit 20000

# Use vi-style key bindings (for copy mode)
setw -g mode-keys vi

# Pass 24-bit colour through to programs inside tmux (nvim colorschemes, the
# truecolor mdview themes). Needs tmux >= 3.2.
#
# Terminals are matched by the *outer* terminal's TERM, and the modern ones do
# not contain "256col" — ghostty reports xterm-ghostty, kitty xterm-kitty — so a
# "*256col*" pattern silently does nothing for them. Verified on a scratch tmux
# socket: xterm-ghostty + "*256col*:RGB" leaves RGB off. Hence the explicit list.
# A bare "*" would work too, but claims RGB for terminals that cannot do it.
set -as terminal-features ",xterm-ghostty:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB,*256col*:RGB"

# glow (and other termenv-based tools) decide their own colour depth from
# COLORTERM, which tmux does not set. Without this they emit 256-colour
# approximations no matter what the line above lets through. Applies to newly
# created panes only. Measured: 0 truecolor codes without it, 2397 with.
set-environment -g COLORTERM truecolor
